        <h1>Selman Utku – Sports Technology, Sports Informatics &amp; Sports Management</h1>
        <p>Tech Analyst, Bilişim Vadisi Sports Technology Mentor (Spor Teknolojileri Mentoru), and SportTech Founder based in Istanbul, Türkiye. Working at the intersection of sports management (spor yönetimi), sports informatics (spor bilişimi), sports technology (spor teknolojileri), digital transformation, innovation management, and AI automation.</p>
        <h2>Core Reference Domains</h2>
        <ul>
          <li><strong>Sports Technology (Spor Teknolojileri / SportTech):</strong> Digital platforms, SaaS management tools, and AI-enabled solutions modernizing sports clubs, federations, and athletic ecosystems.</li>
          <li><strong>Sports Informatics (Spor Bilişimi):</strong> Information systems, relational data modeling, and decision-support architectures uniting sports science with information technology.</li>
          <li><strong>Sports Management (Spor Yönetimi):</strong> Data-informed institutional strategy, governance, and sustainable digital transformation for sports clubs, federations, academies, and enterprises.</li>
        </ul>
        <h2>Mentorship &amp; Founded Ventures</h2>
        <ul>
          <li><strong>Bilişim Vadisi – Sports Technology Mentor (Spor Teknolojileri Mentoru):</strong> Mentoring SportTech and sports informatics startups on product strategy, business modeling, and industry partnerships.</li>
          <li><a href="https://selmanutku.com/projeler/sporttech-turkiye">SportTech Türkiye</a> (<a href="https://sporttech.com.tr">sporttech.com.tr</a>) – Sports technology ecosystem and innovation community in Türkiye.</li>
          <li><a href="https://selmanutku.com/projeler/sporsepeti">Sporsepeti</a> (<a href="https://sporsepeti.com.tr">sporsepeti.com.tr</a>) – Sports information technology (spor bilişimi) venture offering digital management software, event discovery platforms, and sports content.</li>
          <li><a href="https://selmanutku.com/projeler/sportsfly">SportsFly</a> (<a href="https://sportsfly.com.tr">sportsfly.com.tr</a>) – End-to-end digital management SaaS platform for sports clubs, academies, and facilities.</li>
        </ul>
        <h2>Research Topics</h2>
        <ul>
          <li><a href="https://selmanutku.com/yazilar/kurumsal-dijital-donusumde-is-analizinin-stratejik-rolu">The Strategic Role of Business Analysis in Enterprise Digital Transformation</a></li>
          <li><a href="https://selmanutku.com/yazilar/yapay-zeka-destekli-is-surecleri-ve-kurumsal-verimlilik">AI-Powered Business Workflows and Institutional Productivity</a></li>
          <li><a href="https://selmanutku.com/yazilar/spor-kulubleri-ve-tesisler-icin-dijital-yonetim-mimarisi">Digital Management Architecture for Sports Clubs and Facilities</a></li>
          <li><a href="https://selmanutku.com/yazilar/teknoloji-stratejisi-arac-seciminden-deger-mimarisine">Technology Strategy: From Tool Selection to Value Architecture</a></li>
          <li><a href="https://selmanutku.com/yazilar/sporttech-ekosisteminde-urun-gelistirme-ve-girisimcilik">Product Development and Entrepreneurship in the SportTech Ecosystem</a></li>
          <li><a href="https://selmanutku.com/yazilar/kurum-ici-inovasyon-kulturu-ve-surdurulebilir-degisim">Building an Internal Innovation Culture for Sustainable Change</a></li>
